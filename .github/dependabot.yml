version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint (used by `npm run lint`) doesn't support TypeScript 7
      # yet. Remove this once a typescript-eslint release supports TS 7.
      - dependency-name: 'typescript'
        versions: ['7.x']
